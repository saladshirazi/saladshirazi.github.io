<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>دکمه کپی زندگی</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      direction: rtl;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .big-btn {
      margin: 20px auto;
      padding: 20px 40px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }
    .big-btn:hover {
      background: #0056b3;
    }
    .content {
      margin: 40px auto;
      max-width: 600px;
      font-size: 18px;
      line-height: 1.8;
    }
    .footer {
      margin: 40px 0 20px;
    }
  </style>
</head>
<body>

  <!-- دکمه بزرگ در ابتدای سایت -->
  <button class="big-btn" onclick="copyLife()">کپی کردن عبارت «زندگی»</button>

  <div class="content">
    <p>
      این یک صفحه نمونه است که در آن می‌توانید با فشردن دکمه بالا یا پایین،
      عبارت «زندگی» را در کلیپ‌بورد خود کپی کنید.
    </p>
  </div>

  <!-- دکمه در انتهای سایت -->
  <div class="footer">
    <button class="big-btn" onclick="copyLife()">کپی دوباره عبارت «زندگی»</button>
  </div>

  <script>
    function copyLife() {
      const text = "زندگی";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          alert("عبارت «زندگی» کپی شد ✅");
        }, function() {
          alert("کپی انجام نشد ❌");
        });
      } else {
        // روش قدیمی برای مرورگرهای خیلی قدیمی
        const tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        alert("عبارت «زندگی» کپی شد ✅");
      }
    }
  </script>

</body>
</html>
