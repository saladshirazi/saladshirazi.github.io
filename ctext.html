<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>کپی کردن</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      direction: rtl;
      background: #fafafa;
      margin: 0;
      padding: 0;
    }
    .copy-btn {
      margin: 25px auto;
      padding: 22px 45px;
      font-size: 26px;
      border: none;
      border-radius: 14px;
      background: #0084ff;
      color: #fff;
      cursor: pointer;
    }
    .copy-btn:hover {
      background: #0066c9;
    }
    .space {
      height: 500px;
    }
  </style>
</head>
<body>

  <!-- دکمه بزرگ در ابتدای سایت -->
  <button class="copy-btn" onclick="copyText()">کپی کردن</button>

  <div class="space"></div>

  <!-- دکمه بزرگ در انتهای سایت -->
  <button class="copy-btn" onclick="copyText()">کپی کردن</button>

  <script>
    function copyText() {
      const text = "زندگی";
      navigator.clipboard.writeText(text).then(() => {
        alert("کپی شد");
      });
    }
  </script>

</body>
</html>
