<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Copy Page</title>
<style>
    body {
        font-family: sans-serif;
        direction: rtl;
        padding: 30px;
        background: #f0f0f0;
        text-align: center;
    }

    /* دکمه خیلی بزرگ */
    .copy-btn {
        background: #007bff;
        color: white;
        padding: 35px 50px;
        font-size: 40px;
        font-weight: bold;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin: 30px 0;
        width: 90%;
        max-width: 900px;
    }
    .copy-btn:hover {
        background: #0056b3;
    }

    /* قالب ثابت برای متن */
    #text {
        background: white;
        padding: 25px;
        border-radius: 15px;
        font-size: 20px;
        line-height: 1.8;
        margin: 30px auto;
        width: 90%;
        max-width: 900px;

        /* جلوگیری از خروج متن از قالب */
        height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<button class="copy-btn" onclick="copyText()">📋 کپی کردن</button>

<div id="text">
    <!-- متن فایل بزرگت را اینجا قرار بده -->
    اینجا متن فایل قرار می‌گیرد...
</div>

<button class="copy-btn" onclick="copyText()">📋 کپی کردن</button>

<script>
function copyText() {
    const text = document.getElementById("text").innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("متن با موفقیت کپی شد!");
    });
}
</script>

</body>
</html>
